openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: delivery
    description: Customer delivery operations
  - name: support
    description: Customer support operations
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the signed-in profile and staff role
      responses:
        "200":
          description: Active signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401": { description: Authentication required }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a customer or driver account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: New signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400": { description: Invalid registration details }
        "409": { description: An account already uses this email address }
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset email
      description: Always accepts a validly shaped request without revealing whether the email belongs to an active account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAccepted"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Consume a password reset link and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmation"
      responses:
        "200":
          description: Password changed and a new session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400": { description: Malformed reset link or invalid password }
        "410": { description: Expired or already-used reset link }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /notifications:
    get:
      operationId: listNotifications
      tags: [support]
      summary: List signed-in notifications with safe support deep-link context
      responses:
        "200":
          description: Notifications owned by the signed-in requester
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
        "401": { description: Authentication required }
  /deliveries/summary:
    get:
      operationId: getDeliverySummary
      tags: [delivery]
      summary: Get customer delivery summary
      responses:
        "200":
          description: Customer summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
  /addresses/suggestions:
    get:
      operationId: listAddressSuggestions
      tags: [delivery]
      summary: Search approved address suggestions for a delivery
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 160
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Address suggestions, or a safe provider-unavailable response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressSuggestions"
        "400": { description: Search text is too short or too long }
  /addresses:
    get:
      operationId: listCustomerAddresses
      tags: [delivery]
      summary: List saved addresses for the signed-in customer
      responses:
        "200":
          description: Customer-owned saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedAddress"
        "401": { description: Authentication required }
        "403": { description: Customer role required }
    post:
      operationId: createCustomerAddress
      tags: [delivery]
      summary: Save an address for the signed-in customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedAddressInput"
      responses:
        "201":
          description: Saved customer address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "400": { description: Invalid saved address }
        "403": { description: Customer role required }
  /addresses/{id}:
    patch:
      operationId: updateCustomerAddress
      tags: [delivery]
      summary: Update a customer-owned saved address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedAddressInput"
      responses:
        "200":
          description: Updated customer address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "400": { description: Invalid saved address }
        "403": { description: Customer role required }
        "404": { description: Address not found }
    delete:
      operationId: deleteCustomerAddress
      tags: [delivery]
      summary: Delete a customer-owned saved address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Address deleted }
        "403": { description: Customer role required }
        "404": { description: Address not found }
  /deliveries/quote:
    post:
      operationId: createDeliveryQuote
      tags: [delivery]
      summary: Calculate a server-side delivery quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryQuoteInput"
      responses:
        "200":
          description: Delivery quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryQuote"
        "400":
          description: Invalid delivery details
  /deliveries:
    get:
      operationId: listDeliveries
      tags: [delivery]
      summary: List customer deliveries
      responses:
        "200":
          description: Customer deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
    post:
      operationId: createDelivery
      tags: [delivery]
      summary: Create a delivery and Stripe payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Created delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutDelivery"
  /payments/stripe-config:
    get:
      operationId: getStripePaymentConfig
      tags: [payment]
      summary: Get customer-safe Stripe checkout configuration
      responses:
        "200":
          description: Stripe publishable configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePaymentConfig"
  /deliveries/{id}:
    get:
      operationId: getDelivery
      tags: [delivery]
      summary: Get a delivery detail
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Delivery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "404":
          description: Delivery not found
  /deliveries/{id}/route:
    get:
      operationId: getDeliveryRoute
      tags: [delivery]
      summary: Get a provider-backed route and authorized live driver location
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Route information or an explicit unavailable fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "403": { description: Delivery access required }
        "404": { description: Delivery not found }
  /deliveries/{id}/recipient-verification:
    get:
      operationId: getRecipientVerification
      tags: [delivery]
      summary: Get the signed-in customer's active recipient verification code
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Active customer-owned recipient verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientVerification"
        "403": { description: Customer role required }
        "404": { description: Active verification code not found }
  /deliveries/{id}/photos/upload-url:
    post:
      operationId: createDeliveryPhotoUploadUrl
      tags: [delivery]
      summary: Prepare a private package photo upload
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPhotoUploadInput"
      responses:
        "201":
          description: Short-lived private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPhotoUpload"
        "400": { description: Invalid photo metadata }
        "403": { description: Delivery access required }
        "404": { description: Delivery not found }
        "503": { description: Private storage unavailable }
  /deliveries/{id}/photos:
    get:
      operationId: listDeliveryPhotos
      tags: [delivery]
      summary: List private package photos for authorized delivery participants
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Authorized package photos with short-lived download URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryPhoto"
        "403": { description: Delivery access required }
        "404": { description: Delivery not found }
    post:
      operationId: attachDeliveryPhoto
      tags: [delivery]
      summary: Attach a verified private package photo to a delivery
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPhotoAttachInput"
      responses:
        "201":
          description: Attached private package photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPhoto"
        "400": { description: Invalid or unverified photo }
        "403": { description: Delivery access required }
        "404": { description: Delivery not found }
  /support/tickets:
    get:
      operationId: listCustomerSupportTickets
      tags: [support]
      summary: List the signed-in customer's support tickets
      responses:
        "200":
          description: Customer-owned tickets, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequesterSupportSource" }
        "401": { description: Authentication required }
        "403": { description: Customer role required }
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /support/tickets/{id}/conversation:
    get:
      operationId: listCustomerSupportTicketConversation
      tags: [support]
      summary: List the signed-in customer's support ticket conversation
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Original ticket message followed by requester-visible replies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequesterSupportConversationEntry" }
        "403": { description: Customer role required }
        "404": { description: Support ticket not found }
    post:
      operationId: createCustomerSupportTicketConversationReply
      tags: [support]
      summary: Reply to the signed-in customer's support ticket
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequesterSupportConversationReplyInput" }
      responses:
        "200":
          description: Idempotently accepted existing reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequesterSupportConversationReply" }
        "201":
          description: Created requester reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequesterSupportConversationReply" }
        "400": { description: Invalid reply }
        "403": { description: Customer role required }
        "404": { description: Support ticket not found }
  /driver/deliveries:
    get:
      operationId: listDriverDeliveries
      tags: [delivery]
      summary: List deliveries assigned to the signed-in driver
      responses:
        "200":
          description: Driver deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401": { description: Authentication required }
        "403": { description: Driver role required }
  /driver/profile:
    get:
      operationId: getDriverProfile
      tags: [driver]
      summary: Get the signed-in driver's operational profile
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        "403": { description: Driver role required }
    patch:
      operationId: updateDriverProfile
      tags: [driver]
      summary: Update safe profile fields and submit compliance changes for review
      description: The authenticated driver is derived only from the session. Vehicle, license, registration, and insurance changes remain pending until staff approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverProfileUpdate"
      responses:
        "200":
          description: Updated profile and compliance review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfileUpdateResult"
        "400": { description: Invalid profile update }
        "403": { description: Driver role required }
  /driver/onboarding:
    get:
      operationId: getDriverOnboarding
      tags: [driver]
      summary: Get the signed-in driver's onboarding record
      responses:
        "200":
          description: Driver onboarding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOnboarding"
    patch:
      operationId: updateDriverOnboarding
      tags: [driver]
      summary: Save driver onboarding information for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverOnboardingInput"
      responses:
        "200":
          description: Updated onboarding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverOnboarding"
        "400": { description: Invalid onboarding information }
  /driver/settings:
    get:
      operationId: getDriverSettings
      tags: [driver]
      summary: Get the signed-in driver's delivery preferences and location freshness
      responses:
        "200":
          description: Driver-owned settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSettings" }
        "403": { description: Driver role required }
    patch:
      operationId: updateDriverSettings
      tags: [driver]
      summary: Update the signed-in driver's delivery preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverSettingsUpdate" }
      responses:
        "200":
          description: Updated driver settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSettings" }
        "400": { description: Invalid preferences }
        "403": { description: Driver role required }
  /driver/location:
    patch:
      operationId: updateDriverAvailabilityLocation
      tags: [driver]
      summary: Record the signed-in online driver's eligibility location heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverAvailabilityLocationInput" }
      responses:
        "200":
          description: Driver location recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverAvailabilityLocation" }
        "400": { description: Invalid or stale location heartbeat }
        "403": { description: Approved online driver required }
  /driver/documents:
    post:
      operationId: createDriverDocument
      tags: [driver]
      summary: Confirm a verified private driver document upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDocumentConfirmationInput"
      responses:
        "201":
          description: Confirmed driver document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDocument"
        "400": { description: Invalid or unverified document }
        "403": { description: Driver role required }
  /driver/offers:
    get:
      operationId: listDriverOffers
      tags: [driver]
      summary: List short-lived delivery offers available to an approved online driver
      responses:
        "200":
          description: Available delivery offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverOffer"
        "403": { description: Approved online driver required }
  /driver/availability:
    patch:
      operationId: updateDriverAvailability
      tags: [driver]
      summary: Set an approved driver's online availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverAvailabilityInput"
      responses:
        "200":
          description: Updated driver profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverProfile"
        "403": { description: Approved driver required }
  /driver/deliveries/{id}/accept:
    post:
      operationId: acceptDriverDelivery
      tags: [driver]
      summary: Atomically accept an offered searching delivery
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Accepted delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400": { description: Invalid delivery identifier }
        "401": { description: Authentication required }
        "403": { description: Approved online driver required }
        "404": { description: Delivery offer not found }
        "409": { description: "Offer was not made to this driver, expired, or is no longer available" }
  /driver/deliveries/{id}/decline:
    post:
      operationId: declineDriverDelivery
      tags: [driver]
      summary: Decline a delivery explicitly offered to the signed-in driver
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Decline recorded (including an idempotent repeat)
          content: { application/json: { schema: { $ref: "#/components/schemas/DriverOfferDecline" } } }
        "400": { description: Invalid delivery identifier }
        "401": { description: Authentication required }
        "403": { description: Driver role required }
        "404": { description: Delivery offer not found }
        "409": { description: Offer belongs to another driver or is no longer declinable }
  /driver/deliveries/{id}/status:
    post:
      operationId: updateDriverDeliveryStatus
      tags: [delivery]
      summary: Advance an assigned delivery through a permitted status transition
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStatusUpdate"
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400": { description: Invalid transition }
        "403": { description: Assignment or role required }
        "404": { description: Delivery not found }
        "409": { description: Delivery changed concurrently }
  /driver/deliveries/{id}/verify-recipient:
    post:
      operationId: verifyDriverRecipient
      tags: [driver]
      summary: Verify the recipient's one-time delivery code without revealing it
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipientVerificationInput"
      responses:
        "200":
          description: Verified and completed delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400": { description: Incorrect or unavailable verification code }
        "403": { description: Assignment required }
  /driver/earnings:
    get:
      operationId: getDriverEarnings
      tags: [driver]
      summary: Get delivery earnings and payout state for the signed-in driver
      responses:
        "200":
          description: Earnings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverEarningsSummary"
        "403": { description: Driver role required }
  /driver/issues:
    get:
      operationId: listDriverIssues
      tags: [driver]
      summary: List the signed-in driver's reported incidents
      responses:
        "200":
          description: Driver-owned incidents, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequesterSupportSource" }
        "401": { description: Authentication required }
        "403": { description: Driver role required }
    post:
      operationId: createDriverIssue
      tags: [driver]
      summary: Report a delivery, safety, customer-unavailable, or package-damage issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverIssueInput"
      responses:
        "201":
          description: Incident recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverIssue"
        "400": { description: Invalid incident report }
  /driver/issues/{id}/conversation:
    get:
      operationId: listDriverIssueConversation
      tags: [driver]
      summary: List the signed-in driver's incident conversation
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Original incident message followed by requester-visible replies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequesterSupportConversationEntry" }
        "403": { description: Driver role required }
        "404": { description: Driver incident not found }
    post:
      operationId: createDriverIssueConversationReply
      tags: [driver]
      summary: Reply to the signed-in driver's incident conversation
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequesterSupportConversationReplyInput" }
      responses:
        "200":
          description: Idempotently accepted existing reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequesterSupportConversationReply" }
        "201":
          description: Created requester reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequesterSupportConversationReply" }
        "400": { description: Invalid reply }
        "403": { description: Driver role required }
        "404": { description: Driver incident not found }
  /events:
    get:
      operationId: subscribeDeliveryEvents
      tags: [delivery]
      summary: Subscribe to authorized delivery updates as a server-sent event stream
      responses:
        "200":
          description: Delivery event stream
          content:
            text/event-stream:
              schema:
                type: string
  /driver/deliveries/{id}/location:
    post:
      operationId: updateDriverLocation
      tags: [delivery]
      summary: Record a location update for an assigned active delivery
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverLocationInput"
      responses:
        "201":
          description: Location recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverLocation"
        "403": { description: Assignment or role required }
        "404": { description: Delivery not found }
        "409": { description: Delivery is no longer active }
  /admin/deliveries/{id}/status:
    post:
      operationId: updateAdminDeliveryStatus
      tags: [delivery]
      summary: Advance a delivery as dispatcher or administrator
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryStatusUpdate"
      responses:
        "200":
          description: Updated operational delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeliveryStatusUpdate"
        "400": { description: Invalid transition }
        "403": { description: Staff role required }
        "404": { description: Delivery not found }
        "409": { description: Delivery changed concurrently }
  /admin/deliveries:
    get:
      operationId: listAdminDeliveries
      tags: [delivery]
      summary: List active deliveries for the dispatch workspace
      parameters:
        - name: search
          in: query
          required: false
          description: Search by order number, pickup or dropoff address, or driver name
          schema: { type: string, maxLength: 160 }
        - name: filter
          in: query
          required: false
          description: Narrow the list to a dispatch queue
          schema: { type: string, enum: [all, unassigned, delayed, in_progress], default: all }

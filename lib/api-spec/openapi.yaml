        "401": { description: Authentication required }
        "403": { description: Driver role required }
  /admin/driver-performance:
    get:
      operationId: listAdminDriverPerformance
      tags: [admin]
      summary: List delivery-derived driver performance for a date range
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Driver performance rows, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DriverPerformance" } } } } }
        "400": { description: "Invalid date range, search, or pagination" }
        "401": { description: Authentication required }
        "403": { description: Administrator or dispatcher role required }
  /admin/driver-performance/detail:
    get:
      operationId: getAdminDriverPerformance
      tags: [admin]
      summary: Get delivery and reward performance history for one driver
      parameters:
        - { name: driverId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Driver performance detail, content: { application/json: { schema: { $ref: "#/components/schemas/DriverPerformanceDetail" } } } }
        "400": { description: Invalid driver identifier or date range }
        "401": { description: Authentication required }
        "403": { description: Administrator or dispatcher role required }
        "404": { description: Driver not found }
  /admin/driver-bonuses:
    get:
      operationId: listAdminDriverBonuses
      tags: [admin]
      summary: List driver reward awards
      parameters:
        - { name: startDate, in: query, schema: { type: string, format: date } }
        - { name: endDate, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, paid, reversed] } }
      responses:
        "200": { description: "Awards, newest first", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DriverBonus" } } } } }
        "400": { description: Invalid award filters }
        "401": { description: Authentication required }
        "403": { description: Administrator or dispatcher role required }
    post:
      operationId: createAdminDriverBonus
      tags: [admin]
      summary: Award a pending driver bonus
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonusInput" } } } }
      responses:
        "201": { description: Pending bonus created, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonus" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonus" } } } }
        "400": { description: Invalid award or missing idempotency key }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
        "409": { description: Idempotency key conflict }
        "422": { description: Driver is not eligible for an award }
  /admin/driver-bonuses/summary:
    get:
      operationId: getAdminDriverBonusSummary
      tags: [admin]
      summary: Get driver reward totals by status
      responses:
        "200": { description: Status totals in USD cents, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonusTotals" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator or dispatcher role required }
  /admin/driver-bonuses/{id}:
    get:
      operationId: getAdminDriverBonus
      tags: [admin]
      summary: Get an award and immutable event history
      parameters: [{ $ref: "#/components/parameters/DriverBonusId" }]
      responses:
        "200": { description: Award detail, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonusDetail" } } } }
        "400": { description: Invalid award identifier }
        "401": { description: Authentication required }
        "403": { description: Administrator or dispatcher role required }
        "404": { description: Award not found }
  /admin/driver-bonuses/{id}/status:
    post:
      operationId: updateAdminDriverBonusStatus
      tags: [admin]
      summary: Approve, pay, or explicitly reverse a driver bonus
      parameters: [{ $ref: "#/components/parameters/DriverBonusId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonusStatusInput" } } } }
      responses:
        "200": { description: Updated award or idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/DriverBonus" } } } }
        "400": { description: "Invalid transition, reason, identifier, or missing idempotency key" }
        "401": { description: Authentication required }
        "403": { description: Administrator role required }
        "404": { description: Award not found }
        "409": { description: Invalid transition or idempotency key conflict }
components:
  parameters:
    DeliveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DriverBonusId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DriverPerformanceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    AdminSettingsUserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthSession:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [id, firstName, lastName, email, emailVerified, phoneVerified, role]
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string }
            phone: { type: string, nullable: true }
            emailVerified: { type: boolean }
            phoneVerified: { type: boolean }
            role: { type: string, enum: [customer, driver, admin, dispatcher, support] }
    RegistrationInput:
      oneOf:
        - $ref: "#/components/schemas/CustomerRegistrationInput"
        - $ref: "#/components/schemas/DriverRegistrationInput"
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    PasswordResetAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    PasswordResetConfirmation:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 10, maxLength: 256 }
    CustomerRegistrationInput:
      type: object
      required: [firstName, lastName, email, password, phone]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email:
          type: string
          maxLength: 254
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        password: { type: string, minLength: 10, maxLength: 256 }
        phone:
          type: string
          description: Include 10 to 15 digits; separators are allowed.
          maxLength: 32
          pattern: '^(?=(?:\D*\d){10,15}\D*$)[+().\s\d-]+$'
        accountType:
          type: string
          enum: [customer]
          default: customer
    DriverRegistrationInput:
      type: object
      required: [firstName, lastName, email, password, accountType]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email:
          type: string
          maxLength: 254
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        password: { type: string, minLength: 10, maxLength: 256 }
        phone:
          type: string
          nullable: true
          maxLength: 32
        accountType:
          type: string
          enum: [driver]
    DeliverySummary:
      type: object
      required: [customerName, activeCount, pastCount, savedPlaces]
      properties:
        customerName: { type: string }
        activeCount: { type: number, format: int32 }
        pastCount: { type: number, format: int32 }
        savedPlaces:
          type: array
          items:
            $ref: "#/components/schemas/SavedPlace"
    SavedPlace:
      type: object
      required: [id, label, address]
      properties:
        id: { type: string }
        label: { type: string }
        address: { type: string }
    SavedAddress:
      type: object
      required: [id, label, fullAddress, street, city, state, postalCode, country, latitude, longitude, instructions, isDefault, createdAt, updatedAt]
      properties:
        id: { type: string }
        label: { type: string, enum: [Home, Work, Other] }
        fullAddress: { type: string }
        street: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        instructions: { type: ["string", "null"] }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SavedAddressInput:
      type: object
      required: [label, fullAddress]
      properties:
        label: { type: string, enum: [Home, Work, Other] }
        fullAddress: { type: string, minLength: 3, maxLength: 300 }
        street: { type: ["string", "null"], maxLength: 200 }
        city: { type: ["string", "null"], maxLength: 120 }
        state: { type: ["string", "null"], maxLength: 120 }
        postalCode: { type: ["string", "null"], maxLength: 30 }
        country: { type: ["string", "null"], maxLength: 120 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        instructions: { type: ["string", "null"], maxLength: 500 }
        isDefault: { type: boolean }
    AddressSuggestion:
      type: object
      required: [id, label, address, latitude, longitude, source]
      properties:
        id: { type: string }
        label: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        source: { type: string, enum: [google, saved] }
        street: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        postalCode: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
    AddressSuggestions:
      type: object
      required: [suggestions, providerStatus]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AddressSuggestion"
        providerStatus: { type: string, enum: [available, unavailable] }
        message: { type: ["string", "null"] }
    DeliveryQuoteInput:
      type: object
      required: [pickupAddress, dropoffAddress, category, size, weight, care, priority]
      properties:
        pickupAddress: { type: string, minLength: 3 }
        dropoffAddress: { type: string, minLength: 3 }
        category: { type: string }
        size: { type: string, enum: [small, medium, large] }
        weight: { type: string, enum: [under5, 5to20, 20to50] }
        care: { type: string, enum: [standard, fragile, priority, temperature] }
        priority: { type: string, enum: [asap, scheduled] }
        scheduledPickupStartAt: { type: ["string", "null"], format: date-time }
        scheduledPickupEndAt: { type: ["string", "null"], format: date-time }
        pickupLatitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        pickupLongitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        dropoffLatitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        dropoffLongitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
    DeliveryQuote:
      type: object
      required: [id, baseFare, distanceFee, careFee, deliveryFee, customerServiceFee, smallOrderFee, policyUpdatedAt, tax, total, eta, paymentMode, scheduledPickupStartAt, scheduledPickupEndAt]
      properties:
        id: { type: string }
        baseFare: { type: number }
        distanceFee: { type: number }
        careFee: { type: number }
        deliveryFee: { type: number }
        customerServiceFee: { type: number }
        smallOrderFee: { type: number }
        policyUpdatedAt: { type: string }
        tax: { type: number }
        discount: { type: number }
        total: { type: number }
        eta: { type: string }
        paymentMode: { type: string, enum: [test, stripe] }
        scheduledPickupStartAt: { type: ["string", "null"], format: date-time }
        scheduledPickupEndAt: { type: ["string", "null"], format: date-time }
    DeliveryInput:
      allOf:
        - $ref: "#/components/schemas/DeliveryQuoteInput"
        - type: object
          required: [quoteId, pickupName, pickupPhone, recipientName, recipientPhone, prohibitedItemsConfirmed]
          properties:
            quoteId: { type: string }
            pickupName: { type: string, minLength: 1 }
            pickupPhone: { type: string, minLength: 7 }
            pickupInstructions: { type: string }
            recipientName: { type: string, minLength: 1 }
            recipientPhone: { type: string, minLength: 7 }
            deliveryInstructions: { type: string }
            promotionCode: { type: string, minLength: 1, maxLength: 100 }
            prohibitedItemsConfirmed: { type: boolean, enum: [true] }
    Delivery:
      type: object
      required: [id, orderNumber, pickupAddress, dropoffAddress, category, care, total, status, eta, createdAt, recipientName, driverName, driverRating, vehicle, pickupContactName, pickupContactPhone, pickupInstructions, recipientPhone, deliveryInstructions, size, weight, deliveryDistanceMiles, expectedMinutes, mapMode, prohibitedItemsConfirmed, prohibitedItemsConfirmedAt, prohibitedItemsPolicyVersion, scheduledPickupStartAt, scheduledPickupEndAt, events]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        category: { type: string }
        care: { type: string }
        total: { type: number }
        status: { type: string }
        eta: { type: string }
        createdAt: { type: string }
        recipientName: { type: string }
        driverName: { type: ["string", "null"] }
        driverRating: { type: ["number", "null"] }
        vehicle: { type: ["string", "null"] }
        pickupContactName: { type: string }
        pickupContactPhone: { type: string }
        pickupInstructions: { type: ["string", "null"] }
        recipientPhone: { type: string }
        deliveryInstructions: { type: ["string", "null"] }
        size: { type: string }
        weight: { type: string }
        deliveryDistanceMiles: { type: ["number", "null"] }
        expectedMinutes: { type: ["number", "null"], format: int32 }
        scheduledPickupStartAt: { type: ["string", "null"], format: date-time }
        scheduledPickupEndAt: { type: ["string", "null"], format: date-time }
        mapMode: { type: string, enum: [verified, demo] }
        pickupLatitude: { type: ["number", "null"] }
        pickupLongitude: { type: ["number", "null"] }
        dropoffLatitude: { type: ["number", "null"] }
        dropoffLongitude: { type: ["number", "null"] }
        prohibitedItemsConfirmed: { type: boolean }
        prohibitedItemsConfirmedAt: { type: ["string", "null"], format: date-time }
        prohibitedItemsPolicyVersion: { type: ["string", "null"] }
        driverLocation:
          oneOf:
            - $ref: "#/components/schemas/DriverLocation"
            - type: "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryEvent"
    StaffDelivery:
      type: object
      required: [id, orderNumber, pickupAddress, dropoffAddress, category, care, status, eta, createdAt, driverName, vehicle, size, weight, deliveryDistanceMiles, expectedMinutes, scheduledPickupStartAt, scheduledPickupEndAt, pickupLatitude, pickupLongitude, dropoffLatitude, dropoffLongitude, mapMode, events, driverId, driverLocation, priority, updatedAt, isDelayed]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        category: { type: string }
        care: { type: string }
        status: { type: string }
        eta: { type: string }
        createdAt: { type: string }
        driverName: { type: ["string", "null"] }
        vehicle: { type: ["string", "null"] }
        size: { type: string }
        weight: { type: string }
        deliveryDistanceMiles: { type: ["number", "null"] }
        expectedMinutes: { type: ["number", "null"], format: int32 }
        scheduledPickupStartAt: { type: ["string", "null"], format: date-time }
        scheduledPickupEndAt: { type: ["string", "null"], format: date-time }
        pickupLatitude: { type: ["number", "null"] }
        pickupLongitude: { type: ["number", "null"] }
        dropoffLatitude: { type: ["number", "null"] }
        dropoffLongitude: { type: ["number", "null"] }
        mapMode: { type: string, enum: [verified, demo] }
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryEvent"
        driverId: { type: ["string", "null"] }
        driverLocation:
          oneOf:
            - $ref: "#/components/schemas/DriverLocation"
            - type: "null"
        priority: { type: string, enum: [asap, scheduled] }
        updatedAt: { type: string }
        isDelayed: { type: boolean }
    AdminDeliveryStatusUpdate:
      type: object
      required: [id, status, updatedAt]
      properties:
        id: { type: string }
        status: { type: string }
        updatedAt: { type: string }
    DispatchAlert:
      type: object
      required: [id, deliveryId, orderNumber, type, title, message, recommendedAction, createdAt, acknowledgedAt]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        orderNumber: { type: string }
        type: { type: string, enum: [delivery_failed, delivery_cancelled, delivery_delayed] }
        title: { type: string }
        message: { type: string }
        recommendedAction: { type: string }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
    ApprovedDriver:
      type: object
      required: [id, name, vehicle, availabilityStatus, totalDeliveries]
      properties:
        id: { type: string }
        name: { type: string }
        vehicle: { type: ["string", "null"] }
        availabilityStatus: { type: string }
        totalDeliveries: { type: number }
    CheckoutDelivery:
      allOf:
        - $ref: "#/components/schemas/Delivery"
        - type: object
          required: [payment]
          properties:
            payment:
              type: object
              required: [provider, paymentIntentId, clientSecret]
              properties:
                provider: { type: string, enum: [stripe] }
                paymentIntentId: { type: string }
                clientSecret: { type: string }
    StripePaymentConfig:
      type: object
      required: [publishableKey]
      properties:
        publishableKey: { type: string }
    DeliveryEvent:
      type: object
      required: [label, completed]
      properties:
        label: { type: string }
        completed: { type: boolean }
        time: { type: ["string", "null"] }
    RoutePoint:
      type: object
      required: [latitude, longitude, label]
      properties:
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        label: { type: string }
    DeliveryRoute:
      type: object
      required: [status, pickup, dropoff, driverLocation, distanceMeters, durationSeconds, encodedPolyline, message]
      properties:
        status: { type: string, enum: [available, unavailable, demo] }
        pickup:
          $ref: "#/components/schemas/RoutePoint"
        dropoff:
          $ref: "#/components/schemas/RoutePoint"
        driverLocation:
          oneOf:
            - $ref: "#/components/schemas/DriverLocation"
            - type: "null"
        distanceMeters: { type: ["number", "null"] }
        durationSeconds: { type: ["number", "null"] }
        encodedPolyline: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
    DeliveryPhotoUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        size: { type: number, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    DeliveryPhotoUpload:
      type: object
      required: [uploadURL, objectPath, expiresAt]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        expiresAt: { type: string, format: date-time }
    DeliveryPhotoAttachInput:
      type: object
      required: [objectPath, size, contentType]
      properties:
        objectPath: { type: string }
        size: { type: number, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    DeliveryPhoto:
      type: object
      required: [id, deliveryId, contentType, size, downloadUrl, createdAt]
      properties:
        id: { type: string }
        deliveryId: { type: string }
        contentType: { type: string }
        size: { type: number }
        downloadUrl: { type: string }
        createdAt: { type: string, format: date-time }
    SupportTicketInput:
      type: object
      required: [category, message]
      properties:
        category: { type: string }
        message: { type: string, minLength: 5 }
    SupportTicket:
      type: object
      required: [id, category, message, status, createdAt]
      properties:
        id: { type: string }
        category: { type: string }
        message: { type: string }
        status: { type: string }
        createdAt: { type: string }
    RequesterSupportConversationPreview:
      type: object
      required: [body, createdAt, authorRole]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
        authorRole: { type: string, enum: [requester, staff] }
    RequesterSupportSource:
      type: object
      required: [id, source, category, status, priority, createdAt, updatedAt, lastConversationPreview, hasSupportReply]
      properties:
        id: { type: string }
        source: { type: string, enum: [customer_ticket, driver_issue] }
        category: { type: string }
        status: { type: string }
        priority: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastConversationPreview:
          oneOf:
            - $ref: "#/components/schemas/RequesterSupportConversationPreview"
            - type: "null"
        hasSupportReply: { type: boolean, description: True when the latest requester-visible conversation entry is a staff reply. }
    Notification:
      type: object
      required: [id, type, title, body, readAt, createdAt, supportSource, supportId]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        supportSource: { type: [string, "null"], enum: [customer_ticket, driver_issue, null] }
        supportId: { type: [string, "null"] }
    AdminSupportRequester:
      type: object
      required: [role, name, email, phone]
      properties:
        role: { type: string, enum: [customer, driver] }
        name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
    AdminCustomerListItem:
      type: object
      required: [id, firstName, lastName, email, phone, status, createdAt, deliveryCount, deliveryStatusCounts]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        deliveryCount: { type: number }
        deliveryStatusCounts:
          type: object
          additionalProperties: { type: number }
    AdminCustomerDelivery:
      type: object
      required: [id, orderNumber, status, total, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string }
        total: { type: number }
        createdAt: { type: string, format: date-time }
    AdminCustomerDetail:
      type: object
      required: [customer, deliveries, deliveryStatusCounts, supportTickets]
      properties:
        customer: { $ref: "#/components/schemas/AdminCustomerListItem" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/AdminCustomerDelivery" }
        deliveryStatusCounts:
          type: object
          additionalProperties: { type: number }
        supportTickets:
          type: array
          items: { $ref: "#/components/schemas/SupportTicket" }
    AdminCustomerStatusUpdateInput:
      type: object

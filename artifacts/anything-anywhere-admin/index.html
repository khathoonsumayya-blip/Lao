<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Lao Admin" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lao Admin" />

    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const removeInjectedPreviewOverlay = () => {
          for (const element of document.body.children) {
            if (
              element instanceof HTMLDivElement &&
              element.id === '' &&
              element.className === '' &&
              element.childElementCount === 0 &&
              element.textContent === '' &&
              element.style.position === 'fixed' &&
              element.style.top === '0px' &&
              element.style.left === '0px' &&
              element.style.width === '100%' &&
              element.style.height === '100%' &&
              element.style.pointerEvents === 'none' &&
              element.style.zIndex === '999999999'
            ) {
              element.remove();
            }
          }
        };

        new MutationObserver(removeInjectedPreviewOverlay).observe(
          document.body,
          { childList: true },
        );
        removeInjectedPreviewOverlay();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
